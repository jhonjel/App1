<!-- Archivo: src/app/app.component.html -->

<ion-app>
  <!-- Menú lateral - SOLO para admins -->
  <ion-menu
    *ngIf="!esVisitante"
    contentId="main-content"
    side="start"
    menuId="first"
    type="overlay">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menú</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <!-- Mis Vehículos -->
        <ion-item routerLink="/tabs" button>
          <ion-icon name="car-outline" slot="start"></ion-icon>
          <ion-label>Mis Vehículos</ion-label>
        </ion-item>

        <!-- Crear Ruta -->
        <ion-item routerLink="/tabs/crear-ruta" button>
          <ion-icon name="add-circle-outline" slot="start"></ion-icon>
          <ion-label>Crear Ruta</ion-label>
        </ion-item>

        <!-- Mapa en Tiempo Real -->
        <ion-item routerLink="/mapa-vehiculos" button>
          <ion-icon name="map-outline" slot="start"></ion-icon>
          <ion-label>Mapa en Tiempo Real</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Contenido principal -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
